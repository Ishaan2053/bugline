# Runs the tests and ruff for each Python project, builds both Docker images and smoke-tests the
# demo app, and checks relative links in the Markdown files. Runs on every PR and on main, and
# release.yml calls it before it publishes anything.
# The `test` job name and its matrix values are the required checks on main
# (`test (demo-app)`, `test (agents/frontdesk)`): do not rename them.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (release.yml passes the tag)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [demo-app, agents/common, agents/frontdesk, agents/coder, scripts]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4.4.1
      # Loaded under the name compose gives the service (project `bugline`), so the smoke test
      # below runs this exact image.
      - name: Build demo-app
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./demo-app
          load: true
          tags: bugline-demo-app:latest
          cache-from: type=gha,scope=demo-app
          cache-to: type=gha,scope=demo-app,mode=max
      - name: Build frontdesk
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./agents
          file: ./agents/frontdesk/Dockerfile
          push: false
          cache-from: type=gha,scope=frontdesk
          cache-to: type=gha,scope=frontdesk,mode=max
      - uses: docker/setup-qemu-action@v4.4.0
      - name: TEMP arm64 timing demo-app
        run: time docker buildx build --no-cache --platform linux/arm64 ./demo-app
      - name: TEMP arm64 timing frontdesk
        run: time docker buildx build --no-cache --platform linux/arm64 -f agents/frontdesk/Dockerfile ./agents
      # Checks only what the seeded faults leave alone: /share/... and the settle-up sum are
      # faults 1 and 2, and the fixer's PRs change them.
      - name: Smoke test the demo app
        run: |
          docker compose up -d --no-build demo-app
          healthy=false
          for _ in $(seq 1 60); do
            if [ "$(curl -fsS http://localhost:8000/health 2>/dev/null)" = '{"status":"ok"}' ]; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            echo "::error::/health did not return {\"status\":\"ok\"} within 60 s"
            exit 1
          fi
          curl -fsS http://localhost:8000/groups/1/balances | jq -e '.total_spent == 9100.0'
      - name: Demo app logs
        if: failure()
        run: docker compose logs demo-app
      - name: Stop the demo app
        if: always()
        run: docker compose down

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # Offline: relative file links and #anchors only, no web requests. The one excluded URL is
      # a stale anchor in README.md that the README clean-up fixes; drop the exclude after that.
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline --no-progress --include-fragments
            --exclude-path '\.claude'
            --exclude 'intake-rules\.md#handing-a-bug-to-bugline-eng$'
            './**/*.md'
