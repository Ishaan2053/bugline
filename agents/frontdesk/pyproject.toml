# Tool settings only (ruff and pytest). Dependencies are pinned in requirements*.txt.

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls the real Gemini API; runs only with GEMINI_API_KEY set and BUGLINE_LIVE=1"]
