# Tool settings only (ruff and pytest). Dependencies are pinned in requirements*.txt.

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Tests import this folder as the package `common`, the same way the agents do.
pythonpath = [".."]
testpaths = ["tests"]
