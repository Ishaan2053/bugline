# Bugline services. Run `docker compose up --build` from the repo root for the demo app.
# The front desk agent is in the `agents` profile: `docker compose --profile agents up --build`.
name: bugline

services:
  demo-app:
    build: ./demo-app
    ports:
      - "8000:8000"

  frontdesk:
    build:
      context: ./agents  # the agent imports agents/common
      dockerfile: frontdesk/Dockerfile
    profiles: [agents]
    env_file: agents/frontdesk/.env
    environment:
      # The repo is mounted read-only at /repo. bugline.toml names the project, and its
      # user_guide is read relative to it; the intake rules are Bugline's own.
      BUGLINE_CONFIG: /repo/bugline.toml
      FRONTDESK_INTAKE_RULES: /repo/switch/docs/intake-rules.md
      FRONTDESK_CALLS_LOG: state/calls.log
    volumes:
      - frontdesk-state:/app/frontdesk/state
      - .:/repo:ro
    # Lets SWITCH_API_URL=http://host.docker.internal:<port> reach a Switch server on this machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  frontdesk-state:
