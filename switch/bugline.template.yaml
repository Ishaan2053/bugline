# Bugline: the engineering room, its three agents and their roles.
#
# This file is the one definition of bugline-eng. scripts/bootstrap.py sends it
# to the server (POST /gateway/rooms/from-yaml) when the room does not exist;
# it can also be imported in Switch Console. Shape taken from the official
# examples in https://github.com/sandbox-quantum/switch/tree/main/examples/agent-templates
# (support-desk.template.yaml is the closest). Written for template version 1
# on Switch server 0.31.
#
# There is no `agents:` block. That block is run by Switch Console, not the
# server: the server refuses it ("Unknown top-level key(s): agents"), and
# Console cannot run managed coding agents on Windows ("SDK sessions require a
# POSIX SSH execution host"). So all three agents are custom agents in this
# repo (agents/frontdesk and agents/coder) that register over the agent
# protocol. bootstrap.py registers them before it sends this template, because
# the room names them and the server stops if a name is unknown.
#
# What this template cannot do, and what bootstrap.py does instead:
# - The room bugline-support. switch/bugline-support.template.yaml makes it
#   where Switch can create chats; on Telegram, the default, it appears when
#   the bot is added to the group, because Telegram bots cannot create chats.
# - The links between the two rooms. Template `links:` only join rooms made by
#   the same template.
# - Access rules beyond the presets. The fixer's rule ("the owner only, in
#   bugline-eng only") is set on the agent with the Gateway API.
# - The full room instructions. They live in switch/room-instructions-eng.md;
#   the short pointer below is replaced by that file's text.
# - The shared documents. They go into the room as library documents in the
#   bugline-kit package, read from switch/docs/ at run time, so their text
#   exists in one place.
# `!follow-ups off` is a chat command; type it in each room.
version: 1

params:
  room:
    type: string
    description: Name of the engineering room.
    default: bugline-eng
    pattern: "[a-z][a-z0-9-]*"
  frontdesk:
    type: string
    description: Name of the registered front desk agent (agents/frontdesk).
    default: bugline-frontdesk
    input: advanced
  reproducer:
    type: string
    description: Name of the registered reproducer agent (agents/coder, CODER_ROLE=reproducer).
    default: bugline-repro
    input: advanced
  fixer:
    type: string
    description: Name of the registered fixer agent (agents/coder, CODER_ROLE=fixer).
    default: bugline-fixer
    input: advanced
  repo_url:
    type: string
    description: >-
      The GitHub repo the agents read and fix. bootstrap.py passes repo_url
      from bugline.toml; change it here only for an import by hand.
    default: https://github.com/Ishaan2053/bugline
    input: advanced
  bridge:
    type: bridge
    description: >-
      The connection the room and its channel are created on (Slack by
      default). Not Telegram; it cannot create chats.
    required: true

room:
  name: "{room}"
  description: Reproduce, approve and fix bugs reported in bugline-support
  # Replaced by switch/room-instructions-eng.md when bootstrap.py runs.
  instructions: |
    Room rules: switch/room-instructions-eng.md in {repo_url}. Read it and
    follow it. Shared documents: switch/docs/ in the same repo.
  bridge: "{bridge}"
  channel_type: channel_public
  agents: ["{frontdesk}", "{reproducer}", "{fixer}"]
  users: ["{$creator}"]
  # The front desk holds no role (an agent holds one role across all its
  # rooms), so it gets an alias in each room instead.
  aliases:
    "{frontdesk}": frontdesk
  # The coder agents take these roles themselves with `assume_role` each time
  # they connect, so `@reproducer` and `@fixer` reach them.
  roles:
    - name: reproducer
      exclusive: false
      instructions: |
        Reproduce the bug tickets the front desk posts here, and verify the
        fixer's PRs. Follow switch/docs/repro-checklist.md and post your
        verdict in the ticket's thread. Never guess.
    - name: fixer
      exclusive: true
      instructions: |
        Fix a ticket only after the PM approves it in the ticket's thread.
        Follow switch/docs/fix-policy.md. When done, ask @reproducer in that
        thread to verify the PR.
  references:
    - type: github
      name: bugline-repo
      description: The Bugline repo, including the demo app the agents fix
      instructions: >-
        The demo app is in demo-app/. Room rules are in switch/, shared
        documents in switch/docs/, agent briefs in switch/agent-briefs/.
      value:
        urls: ["{repo_url}"]

# Posted once, for the people in the room. It names no agent: the agents are
# not running yet when the room is made, and an addressed coder would start a
# Claude Code run for a greeting.
kickoff: |
  This room is set up. Type `!follow-ups off` here, then start the three
  agents as the README says ("Reproduce it", part B).
